project:
  name: house-poc

inputs:
  photos_dir: Dataset/images
  videos:
    - Dataset/video/vid1.* # The file extension can either be .MOV,.mp4, etc

video:
  fps: 2.0            # frames extracted per second of video
  jpeg_quality: 2     # ffmpeg -q:v scale, lower = better

validation:
  min_short_side: 600     # px, flag smaller images
  blur_ratio: 0.5         # flag if sharpness < ratio * median of its camera group
  min_brightness: 30
  max_brightness: 225

remote:
  session: scan3d
  gpu: T4
  high_mem: false
  auth: oauth2            # OAuth token is loaded from ~/.config/colab-cli/token.json in containers


colmap:
  binary: colmap 

features: 
  camera_model: SIMPLE_RADIAL
  use_gpu: false
  matcher: auto
  sequential_overlap: 15

dense:
  geom_consistency: true
  window_step: 2
  max_image_size: 1024

undistort:
  max_image_size: 2400

sparse: 
  mapper: incremental

mesh:
  texture: true
  target_face_ratio: 0.05
  poisson_depth: 10
  poisson_trim: 1
