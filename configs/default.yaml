project:
  name: house-poc

inputs:
  photos_dir: Dataset/images
  videos:
    - Dataset/video/vid1.* # The file extension can either be .MOV,.mp4, etc

video:
  fps: 2.0            # frames extracted per second of video
  jpeg_quality: 2     # ffmpeg -q:v scale, lower = better
  select: motion_sharpest
  oversample: 3

validation:
  min_short_side: 400     # px, flag smaller images
  blur_ratio: 0.3         # flag if sharpness < ratio * median of its camera group
  min_brightness: 20
  max_brightness: 235

remote:
  session: scan3d
  gpu: T4
  high_mem: false
  auth: oauth2            # OAuth token is loaded from ~/.config/colab-cli/token.json in containers


colmap:
  binary: colmap 

features: 
  camera_model: SIMPLE_RADIAL
  single_camera: false
  use_gpu: false
  learned_recovery: true
  matcher: auto
  sequential_overlap: 15
  max_image_size: 2000
  num_threads: 1

dense:
  backend: colmap
  geom_consistency: true
  min_registered_fraction: 0.2
  view_limit: 40
  source_views: 6
  window_step: 2
  max_image_size: 1024

undistort:
  max_image_size: 2400

sparse: 
  mapper: incremental

mesh:
  max_edge_factor: 6.0
  min_component_faces: 150
  texture: true
  target_face_ratio: 0.15
  poisson_depth: 11
  poisson_trim: 7

splat:
  max_steps: 30000
  max_image_size: 768
  upload_jpeg_quality: 85
  data_factor: 1
  compress: ["spz", "ply"]
  download_ply: true
  clean:
    min_opacity: 0.3
    max_scale_frac: 0.05
    crop_factor: 1.2
    bbox_margin: 0.2

ar:
  target_faces: 120000
  texture_px: 4096
  jpeg_quality: 90
  scale_factor: auto
  marker_id: 0
  marker_length_m: 0.10
