project:
  name: house

inputs:
  photos_dir: Dataset/images
  videos: []

video:
  fps: 2.0
  jpeg_quality: 2

validation:
  min_short_side: 600
  blur_ratio: 0.5
  min_brightness: 30
  max_brightness: 225

remote:
  session: scan3d
  gpu: T4
  high_mem: true
  upload_workers: 4
  chunk_mb: 4
  auth: null

colmap:
  binary: ${COLMAP_BIN}

features:
  camera_model: SIMPLE_RADIAL
  use_gpu: false

sparse:
  mapper: incremental
splat:
  max_steps: 30000
  max_image_size: 768
  extra_args: ["--steps_scaler", "0.25"]

ar:
  target_faces: 250000
  texture_px: 4096
