project:
  name: house

inputs:
  photos_dir: Dataset/images
  videos: []

video:
  fps: 2.0
  jpeg_quality: 2
  select: motion_sharpest
  oversample: 3

validation:
  min_short_side: 400
  blur_ratio: 0.3
  min_brightness: 20
  max_brightness: 235

remote:
  session: scan3d
  gpu: T4
  high_mem: false
  upload_workers: 4
  chunk_mb: 4
  auth: oauth2

colmap:
  # Use the executable on PATH. Railway's worker installs COLMAP into its
  # micromamba environment, so it does not need a host-specific COLMAP_BIN.
  binary: colmap

features:
  camera_model: SIMPLE_RADIAL
  single_camera: false
  use_gpu: false
  learned_recovery: true
  matcher: auto
  sequential_overlap: 15
  # Bound CPU feature extraction memory on small cloud worker instances.
  max_image_size: 2000
  num_threads: 1

dense:
  backend: colmap
  geom_consistency: true
  min_registered_fraction: 0.2
  view_limit: 40
  source_views: 6
  window_step: 2
  max_image_size: 1024

sparse:
  mapper: incremental

mesh:
  max_edge_factor: 6.0
  min_component_faces: 150
  texture: true
  target_face_ratio: 0.15
  poisson_depth: 11
  poisson_trim: 7
splat:
  max_steps: 30000
  max_image_size: 768
  extra_args: ["--steps_scaler", "0.25"]
  clean:
    min_opacity: 0.3
    max_scale_frac: 0.05
    crop_factor: 1.2
    bbox_margin: 0.2

ar:
  target_faces: 120000
  texture_px: 4096
  jpeg_quality: 90
  scale_factor: auto
  marker_id: 0
  marker_length_m: 0.10
