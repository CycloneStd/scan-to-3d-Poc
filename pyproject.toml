[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scan3d"
version = "0.1.0"
description = "Cyclone Studios Scan-to-3D reconstruction pipeline"
requires-python = ">=3.11"
# numpy and opencv come from the conda environment; do not pip-install a second cv2.
dependencies = ["pyyaml>=6"]

[project.scripts]
scan3d = "scan3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]