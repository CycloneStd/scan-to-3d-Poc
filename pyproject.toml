[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scan3d"
version = "0.1.0"
description = "Cyclone Studios Scan-to-3D reconstruction pipeline"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "Pillow>=10", "numpy>=1.24"]

[project.scripts]
scan3d = "scan3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=./.tmp_pytest -p no:cacheprovider"