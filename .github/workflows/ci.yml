
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-syntax:
    name: Python tests and syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -e . pytest httpx -r webxr/backend/requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Run unit tests
        env:
          PYTHONPATH: webxr/backend
        run: python -m pytest -q tests webxr/backend/tests


  webxr:
    name: WebXR type check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webxr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webxr/package-lock.json
      - run: npm ci
      - run: npx --no-install tsc --noEmit
      - run: npm run build
