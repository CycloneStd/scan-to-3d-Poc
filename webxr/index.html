<!doctype html>
<html lang="en" class="dark" data-color-mode="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=3" />
    <meta name="theme-color" content="#151515" />
    <title>Cyclone 3D Scanner</title>
    <link rel="stylesheet" href="./src/assets/fonts/mirage/mirage.css" />
    <link rel="stylesheet" href="./src/styles/components.css" />
    <link rel="stylesheet" href="./src/styles/foundation.css" />
    <link rel="stylesheet" href="./src/styles/landing.css" />
</head>
  <body class="bg-surface-base text-surface">
    <div id="top">
      <div>
          <div
            class="app-headroom pointer-events-none fixed top-[env(safe-area-inset-top,0)] z-999 w-full select-none"
          >
            <div class="w-full">
              <header class="ui-header-bar w-full app-header pointer-events-none hidden lg:block">
                <div class="container-wide px-4">
                  <div class="flex w-full items-center justify-between py-4">
                    <div class="flex flex-1 justify-start">
                      <a class="landing-brand pointer-events-auto" href="#top" aria-label="Cyclone home">
                        <img src="./src/assets/cyclone-wordmark.png" alt="Cyclone" />
                      </a>
                    </div>
                    <div class="flex flex-1 justify-end">
                    
                      <div
                        class="ui-header-nav auth-actions-card border-surface backdrop-blur-surface relative flex h-17 items-center gap-1 overflow-hidden rounded-3xl border-2 p-1 lg:h-15 lg:rounded-[1.375rem] pointer-events-auto flex"
                      >
                        <div class="translucent-glass"></div>
                        <button
                          class="mirror-button m-button relative box-border inline-flex items-center justify-center border-2 outline-4 outline-offset-0 outline-transparent whitespace-nowrap no-underline transition-all duration-100 ease-linear focus-visible:focus-ring will-change-contents h-12 gap-1.5 type-component-lg rounded-component-lg border-transparent bg-transparent text-primary-on-subtle hover:bg-primary-subtle data-[pressed=true]:bg-primary-subtle-hover signup-action"
                          type="button"
                          data-mode="ghost"
                          data-size="md"
                          data-variant="primary"
                        >
                          <span class="signup-label">Signup</span>
                        </button>
                        <a
                          class="mirror-button m-button relative box-border inline-flex items-center justify-center border-2 outline-4 outline-offset-0 outline-transparent whitespace-nowrap no-underline transition-all duration-100 ease-linear focus-visible:focus-ring will-change-contents h-12 gap-1.5 type-component-lg rounded-component-lg border-transparent bg-transparent text-primary-on-subtle hover:bg-primary-subtle data-[pressed=true]:bg-primary-subtle-hover login-action"
                          href="/login"
                          data-mode="ghost"
                          data-size="md"
                          data-variant="primary"
                        >
                          Login
                        </a>
                      </div>
                      
                    </div>
                  </div>
                </div>
              </header>
              <div
                id="mobile-menu-provider"
                class="mobile-menu-provider mobile-app-header w-full lg:hidden"
              >
                
                <div id="mobile-menu-view" class="mobile-menu-view w-full">
                  
                  <header class="mobile-app-header pointer-events-auto w-full px-4 py-4">
                    <div
                      class="ui-header-nav border-surface backdrop-blur-surface relative flex h-17 items-center gap-1 overflow-hidden rounded-3xl border-2 p-1 lg:h-15 lg:rounded-[1.375rem] flex w-full justify-between"
                    >
                      <div class="translucent-glass"></div>
                      <a
                        href="#top"
                        class="landing-brand mobile-landing-brand"
                        aria-label="Cyclone home"
                      >
                        <img src="./src/assets/cyclone-wordmark.png" alt="Cyclone" />
                      </a>
                      <div class="flex gap-1">
                        <button
                          class="mobile-menu-trigger m-button relative box-border inline-flex items-center justify-center border-2 outline-4 outline-offset-0 outline-transparent whitespace-nowrap no-underline transition-all duration-100 ease-linear focus-visible:focus-ring will-change-contents h-14 gap-2 type-component-xl rounded-component-xl border-transparent bg-transparent text-primary-on-subtle hover:bg-primary-subtle data-[pressed=true]:bg-primary-subtle-hover mirror-button min-w-14"
                          data-icon="true"
                          data-mode="ghost"
                          data-size="lg"
                          data-variant="primary"
                          type="button"
                          aria-label="Open menu"
                          aria-haspopup="dialog"
                          aria-expanded="false"
                          aria-controls="mobile-auth-menu"
                        >
                          <svg
                            xmlns="http://www.w3.org/2000/svg"
                            xmlns:xlink="http://www.w3.org/1999/xlink"
                            aria-hidden="true"
                            role="img"
                            class="mobile-menu-lines"
                           
                            width="1em"
                            height="1em"
                            viewBox="0 0 1152 1152"
                          >
                            <path
                              fill="currentColor"
                              d="M960 763H192c-30 0-53 24-53 53s23 53 53 53h768c29 0 53-24 53-53s-23-53-53-53m0-480H192c-30 0-53 24-53 53s23 53 53 53h768c29 0 53-24 53-53s-23-53-53-53"
                            /></svg
                          >
                        </button>
                      </div>
                      
                    </div>
                  </header>
                  <div class="mobile-auth-menu" id="mobile-auth-menu" role="dialog" aria-label="Account menu" aria-modal="true" hidden>
                    <nav class="mobile-auth-menu__panel" aria-label="Account">
                      <div class="mobile-auth-menu__handle" aria-hidden="true"></div>
                      <button class="mobile-auth-menu__item" type="button">
                        <span class="mobile-auth-menu__icon" aria-hidden="true">
                          <svg class="lucide lucide-user-round-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 21a8 8 0 0 1 11.873-7"/><circle cx="10" cy="8" r="5"/><path d="M19 16v6"/><path d="M22 19h-6"/></svg>
                        </span>
                        <span class="signup-label">Signup</span>
                      </button>
                      <a class="mobile-auth-menu__item" href="/login">
                        <span class="mobile-auth-menu__icon" aria-hidden="true">
                          <svg class="lucide lucide-log-in" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
                        </span>
                        <span>Login</span>
                      </a>
                    </nav>
                  </div>
                  
                </div>
                
              </div>
              
            </div>
          </div>
          
          <main class="min-h-svh">
            
            <div
              class="area-renderer bg-surface-base clip-inset-0 relative pb-18 lg:pb-24 rounded-b-surface-lg min-h-lvh"
              style="z-index: 20"
              data-theme
              data-color-mode
            >
              
              <div class="sections-renderer flex flex-col gap-36 lg:gap-48 pt-25 lg:pt-23">
                
                <section
                  class="hero-card-section container-wide relative px-2"
                  id="hero"
                >
                  <div class="relative w-full">
                    <div class="pt-20">
                      
                      <div class="relative w-full pb-8">
                        <div class="flex flex-col items-center gap-3">
                          <h1 class="type-surface-display-md -strong w-full text-center">
                            Reality to 3D
                          </h1>
                          <p class="hero-subtitle text-center px-4">
                            Turn photos and video into detailed 3D scenes you can explore.
                          </p>
                        </div>
                      </div>
                      <div
                        class="hero-card bg-surface-low clip-surface-md flex flex-col items-center overflow-hidden px-2 pt-2 pb-2"
                       
                      >
                        
                        <div
                          class="ui-media-renderer group contents select-none"
                          style="--magic-player-provider-aspect-ratio: 1/1"
                        >
                          <img
                            class="magic-image clip-surface-md-inset w-full object-cover md:hidden w-full aspect-[1/1]"
                            alt="Blue iceberg floating among snow-covered Arctic mountains"
                            src="./src/assets/arctic-iceberg-scan.webp"
                            loading="eager" fetchpriority="high"
                          />
                          <div
                            class="opacity-0 transition-opacity duration-150 group-hover:opacity-100"
                          >
                            
                          </div>
                          
                        </div>
                        
                        <div
                          class="ui-media-renderer group contents select-none"
                          style="--magic-player-provider-aspect-ratio: 3/1"
                        >
                          <img
                            class="magic-image hidden md:block clip-surface-md-inset w-full object-cover w-full aspect-[3/1]"
                            alt="Blue iceberg floating among snow-covered Arctic mountains"
                            src="./src/assets/arctic-iceberg-scan.webp"
                            loading="eager" fetchpriority="high"
                          />
                          <div
                            class="opacity-0 transition-opacity duration-150 group-hover:opacity-100"
                          >
                            
                          </div>
                          
                        </div>
                        
                      </div>
                      
                    </div>
                  </div>
                </section>
                
              </div>
              
            </div>
            
          </main>
          
        </div>
      </div>
    </div>
      <script type="module" src="./src/main.tsx"></script>
      <script type="module" src="./src/scripts/mobile-auth-menu.js"></script>
  </body>
</html>
