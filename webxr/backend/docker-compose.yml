services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scan3d}
      POSTGRES_USER: ${POSTGRES_USER:-scan3d}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.22
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ../..
      dockerfile: webxr/backend/Dockerfile.api
    environment: &backend-env
      WEBXR_ENVIRONMENT: development
      WEBXR_API_PREFIX: /api/v1
      WEBXR_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scan3d}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scan3d}
      WEBXR_REDIS_URL: redis://redis:6379/0
      WEBXR_JWT_SECRET: ${WEBXR_JWT_SECRET:?Set WEBXR_JWT_SECRET in .env}
      WEBXR_FRONTEND_BASE_URL: ${WEBXR_FRONTEND_BASE_URL:-http://localhost:5173}
      WEBXR_CORS_ORIGINS: ${WEBXR_CORS_ORIGINS:-http://localhost:5173}
      WEBXR_SMTP_HOST: mailpit
      WEBXR_SMTP_PORT: 1025
      WEBXR_SMTP_FROM_EMAIL: ${WEBXR_SMTP_FROM_EMAIL:-no-reply@example.test}
      WEBXR_SMTP_STARTTLS: "false"
      WEBXR_STORAGE_BACKEND: local
      WEBXR_UPLOAD_MAX_BYTES: ${WEBXR_UPLOAD_MAX_BYTES:-2147483648}
      WEBXR_UPLOAD_MAX_FILES_PER_SCAN: ${WEBXR_UPLOAD_MAX_FILES_PER_SCAN:-200}
      WEBXR_USER_STORAGE_QUOTA_BYTES: ${WEBXR_USER_STORAGE_QUOTA_BYTES:-21474836480}
      WEBXR_MAX_ACTIVE_JOBS_PER_USER: ${WEBXR_MAX_ACTIVE_JOBS_PER_USER:-2}
      WEBXR_RATE_LIMIT_PER_MINUTE: ${WEBXR_RATE_LIMIT_PER_MINUTE:-10}
      WEBXR_STORAGE_LOCAL_ROOT: /data/storage
      WEBXR_PIPELINE_CONFIG_TEMPLATE: /repo/configs/house.yaml
      WEBXR_PIPELINE_WORK_ROOT: /data/pipeline
      WEBXR_PIPELINE_TRACK: ${WEBXR_PIPELINE_TRACK:-mesh}
      WEBXR_PIPELINE_TIMEOUT_SECONDS: ${WEBXR_PIPELINE_TIMEOUT_SECONDS:-21600}
      WEBXR_PIPELINE_WORK_RETENTION_DAYS: ${WEBXR_PIPELINE_WORK_RETENTION_DAYS:-7}
      COLMAP_BIN: ${COLMAP_BIN:-colmap}
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/data
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: webxr/backend/Dockerfile.worker
    environment: *backend-env
    volumes:
      - backend-data:/data
      - ${COLAB_CONFIG_DIR:-./colab-config}:/home/mambauser/.config/colab
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["micromamba", "run", "--name", "base", "celery", "-A", "app.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=${WEBXR_WORKER_CONCURRENCY:-1}"]

  beat:
    build:
      context: ../..
      dockerfile: webxr/backend/Dockerfile.worker
    environment: *backend-env
    volumes:
      - backend-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["micromamba", "run", "--name", "base", "celery", "-A", "app.worker:celery_app", "beat", "--loglevel=INFO"]

  web:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ../:/app
      - web-node-modules:/app/node_modules
      - ../../web:/web
    command: ["sh", "-c", "if [ ! -x node_modules/.bin/vite ]; then npm ci; fi && npm run dev -- --host 0.0.0.0"]
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  backend-data:
  web-node-modules:
